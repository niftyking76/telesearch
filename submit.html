<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Group - TeleSearch</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            transition: background-color 0.3s, color 0.3s;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100">

<!-- NAVBAR -->
<nav class="bg-white/80 dark:bg-gray-800/80 backdrop-blur border-b border-gray-200 dark:border-gray-700">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
        <a href="index.html" class="flex items-center">
            <i class="fab fa-telegram text-blue-500 text-xl mr-2"></i>
            <span class="font-bold text-lg">TeleSearch</span>
        </a>

        <button id="darkModeToggle" class="p-2">
            <i class="fas fa-moon dark:hidden"></i>
            <i class="fas fa-sun hidden dark:inline"></i>
        </button>
    </div>
</nav>

<!-- FORM -->
<div class="max-w-2xl mx-auto px-4 py-12">

    <h1 class="text-3xl font-bold mb-6 text-center">Submit Your Telegram</h1>

    <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow border border-gray-200 dark:border-gray-700">

        <form id="submitForm" class="space-y-5">

            <!-- Type -->
            <div>
                <label class="block mb-1 font-medium">Type</label>
                <select id="type" class="w-full p-3 rounded-lg border dark:bg-gray-900">
                    <option value="group">Group</option>
                    <option value="channel">Channel</option>
                    <option value="bot">Bot</option>
                </select>
            </div>

            <!-- Title -->
            <div>
                <label class="block mb-1 font-medium">Title</label>
                <input type="text" id="title" placeholder="Enter name"
                    class="w-full p-3 rounded-lg border dark:bg-gray-900">
            </div>

            <!-- Link -->
            <div>
                <label class="block mb-1 font-medium">Telegram Link</label>
                <input type="text" id="link" placeholder="https://t.me/yourlink"
                    class="w-full p-3 rounded-lg border dark:bg-gray-900">
            </div>

            <!-- Category -->
            <div>
                <label class="block mb-1 font-medium">Category</label>
                <select id="category" class="w-full p-3 rounded-lg border dark:bg-gray-900">
                    <option>Crypto</option>
                    <option>Trading</option>
                    <option>Programming</option>
                    <option>Movies</option>
                    <option>Gaming</option>
                    <option>Other</option>
                </select>
            </div>

            <!-- Description -->
            <div>
                <label class="block mb-1 font-medium">Description</label>
                <textarea id="description" rows="4"
                    class="w-full p-3 rounded-lg border dark:bg-gray-900"
                    placeholder="Describe your group..."></textarea>
            </div>

            <!-- Submit -->
            <button type="submit"
                class="w-full bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-lg font-medium">
                Submit
            </button>

        </form>

        <!-- Message -->
        <p id="msg" class="text-center mt-4 text-sm"></p>

    </div>
</div>

<!-- SCRIPT -->
<script>

// 🌙 Theme
function applyTheme() {
    const saved = localStorage.getItem("theme");
    if (saved === "dark") {
        document.documentElement.classList.add("dark");
    }
}
applyTheme();

document.getElementById("darkModeToggle").onclick = () => {
    const html = document.documentElement;
    if (html.classList.contains("dark")) {
        html.classList.remove("dark");
        localStorage.setItem("theme", "light");
    } else {
        html.classList.add("dark");
        localStorage.setItem("theme", "dark");
    }
};

// 🚀 Form submit
document.getElementById("submitForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const data = {
        type: document.getElementById("type").value,
        title: document.getElementById("title").value,
        link: document.getElementById("link").value,
        category: document.getElementById("category").value,
        description: document.getElementById("description").value
    };

    // 🔥 Basic validation
    if (!data.title || !data.link) {
        document.getElementById("msg").innerText = "Please fill all required fields";
        return;
    }

    console.log("Submitted:", data);

    // 👉 Replace this with your API later
    document.getElementById("msg").innerText = "Submitted successfully (demo)";

    this.reset();
});

</script>

</body>
</html>
