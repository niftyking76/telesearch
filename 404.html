<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - TeleSearch</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            transition: background-color 0.3s, color 0.3s;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 flex items-center justify-center min-h-screen">

    <div class="text-center px-6">

        <!-- Icon -->
        <div class="mb-6">
            <i class="fab fa-telegram text-6xl text-blue-500"></i>
        </div>

        <!-- 404 Text -->
        <h1 class="text-6xl font-bold mb-4">404</h1>

        <h2 class="text-2xl font-semibold mb-2">Page Not Found</h2>

        <p class="text-gray-600 dark:text-gray-400 mb-8">
            The page you're looking for doesn't exist or has been moved.
        </p>

        <!-- Buttons -->
        <div class="flex justify-center gap-4 flex-wrap">

            <a href="engine2.html"
                class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg font-medium transition">
                Go to Search
            </a>

            <button onclick="toggleDarkMode()"
                class="px-6 py-3 rounded-lg border border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-800 transition">
                Toggle Theme
            </button>

        </div>

        <!-- Auto redirect text -->
        <p class="mt-6 text-sm text-gray-500">
            Redirecting you in a few seconds...
        </p>

    </div>

    <script>
        // Apply saved theme
        function applyTheme() {
            const saved = localStorage.getItem("theme");

            if (saved === "dark") {
                document.documentElement.classList.add("dark");
            } else if (saved === "light") {
                document.documentElement.classList.remove("dark");
            } else {
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.classList.add("dark");
                }
            }
        }

        // Toggle theme
        function toggleDarkMode() {
            const html = document.documentElement;

            if (html.classList.contains("dark")) {
                html.classList.remove("dark");
                localStorage.setItem("theme", "light");
            } else {
                html.classList.add("dark");
                localStorage.setItem("theme", "dark");
            }
        }

        applyTheme();

        // 🔁 Auto redirect after 3 seconds
        setTimeout(() => {
            window.location.replace("https://niftyking76.github.io/telesearch/engine2.html");
        }, 3000);
    </script>

</body>
</html>
